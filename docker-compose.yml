services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]

  reco-service:
    build: ./services/reco-service
    ports: ["8080:8080"]
    environment:
      RANK_SERVICE_URL: http://rank-service:8080

  rank-service:
    build: ./services/rank-service
    ports: ["8081:8080"]

  business-api:
    build: ./services/business-api
    ports: ["8082:8080"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RECO_SERVICE_URL: http://reco-service:8080
    depends_on: [rabbitmq]

  report-worker:
    build: ./services/report-worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on: [rabbitmq]

  dashboard:
    build: ./dashboard
    ports: ["8501:8501"]
    environment:
      BUSINESS_API_URL: http://business-api:8080
